{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | PawTrack</title>
    <link rel="icon" type="image/png" href="{% static 'clinic/img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'clinic/css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <span class="brand"><img src="{% static 'clinic/img/logo-emblem.png' %}" alt="" width="34" height="34" style="width: 34px; height: 34px; vertical-align: middle; margin-right: 10px;">Falconn Paw Track</span>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'pet_list' %}">Pets</a>
            <a href="{% url 'owner_list' %}">Owners</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
