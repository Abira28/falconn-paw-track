{% if form.non_field_errors %}<p class="error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
{% for field in form %}
    {% if field.name == 'leave_blank' %}
    <div class="hp" aria-hidden="true">{{ field.label_tag }}{{ field }}</div>
    {% else %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="error">{{ field.errors|join:" " }}</p>{% endif %}
    </div>
    {% endif %}
{% endfor %}
